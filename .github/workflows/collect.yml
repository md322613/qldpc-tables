name: collect
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run id of a verify run whose result artifacts should be merged'
        required: true
permissions:
  contents: write
  actions: read
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dl
          pattern: 'res-*'
          merge-multiple: true
          run-id: ${{ github.event.inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          mkdir -p results
          python3 - <<'PY'
          import json, glob, os
          def key(r): return (r['d']['exact'], -(r['d']['upper'] - r['d']['lower']))
          best = {}
          for f in sorted(glob.glob('results/*.json')) + sorted(glob.glob('dl/*.json')):
              if f.endswith('index.json'): continue
              r = json.load(open(f))
              if r['name'] not in best or key(r) > key(best[r['name']][0]): best[r['name']] = (r, f)
          rows = []
          for name, (r, f) in best.items():
              rows.append(r)
              json.dump(r, open(os.path.join('results', os.path.basename(f)), 'w'), indent=1)
          json.dump(rows, open('results/index.json', 'w'), indent=1)
          print(len(rows), 'results')
          PY
          git config user.name "qverify-bot"; git config user.email "actions@users.noreply.github.com"
          git add results && git commit -m "results: merge run ${{ github.event.inputs.run_id }}" && git push || echo "nothing to commit"
